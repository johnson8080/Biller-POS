<script>
  // Paint the saved palette, light/dark choice and text size before the
  // stylesheet loads, so a cold start never flashes the default Forest theme.
  try {
    var auth = JSON.parse(localStorage.getItem("biller.pos.auth") || "null");
    var raw = (auth && auth.uid && localStorage.getItem("biller.pos.shop." + auth.uid)) || localStorage.getItem("biller.pos.v1");
    var savedTheme = JSON.parse(raw || "null");
    var store = savedTheme && savedTheme.store;
    if (store) {
      if (["forest", "ocean", "clay", "plum", "black"].indexOf(store.theme) >= 0) {
        document.documentElement.setAttribute("data-theme", store.theme);
      }
      if (store.colorScheme === "dark" || store.colorScheme === "light") {
        document.documentElement.setAttribute("data-color-scheme", store.colorScheme);
      }
      if (["small", "medium", "large"].indexOf(store.textSize) >= 0) {
        document.documentElement.setAttribute("data-text-size", store.textSize);
      }
    }
  } catch (e) {}
</script>
